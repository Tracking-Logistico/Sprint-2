name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
      - preparetest_sprint2
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PROJECT_KEY: Tracking-Logistico_Sprint-2
  MIN_COVERAGE: 65        # % cobertura mínima
  MAX_DEBT_MIN: 960       # 2 días = 2 x 8 h x 60 min
  MAX_COMPLEXITY: 50      # debe ser menor a este valor

jobs:
  build-and-analyze:
    name: Build and Analyze (monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test y análisis Sonar (todos los módulos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=tracklog20262
          -Dsonar.projectKey=Tracking-Logistico_Sprint-2
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      - name: Quality gates en el Summary (informativo, no bloquea)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API=https://sonarcloud.io/api

          # PR -> pullRequest ; push -> branch
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=$BRANCH"
          fi

          # ---- Estado general del Quality Gate ----
          RESP_G=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/qualitygates/project_status?projectKey=$PROJECT_KEY&$SCOPE")
          if ! echo "$RESP_G" | jq -e '.projectStatus' >/dev/null 2>&1; then
            echo "::warning::No se pudo leer el Quality Gate: $RESP_G"
            exit 0
          fi
          GATE=$(echo "$RESP_G" | jq -r '.projectStatus.status')

          # ---- Métricas generales ----
          RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component?component=$PROJECT_KEY&$SCOPE&metricKeys=coverage,sqale_index,complexity")
          M=$(echo "$RESP" | jq -r '.component.measures[]? | "\(.metric)=\(.value)"')
          get() { echo "$M" | grep "^$1=" | cut -d= -f2; }

          COV=$(get coverage)
          DEBT=$(get sqale_index)
          CX=$(get complexity)

          # ---- Búsqueda de Issues y Severidades via Facets ----
          RESP_FACETS=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&resolved=false&facets=severities&ps=1")

          get_sev() {
            echo "$RESP_FACETS" | jq -r ".facets[]? | select(.property==\"severities\") | .values[]? | select(.val==\"$1\") | .count // 0"
          }

          BLOCKER=$(get_sev "BLOCKER")
          CRITICAL=$(get_sev "CRITICAL")
          MAJOR=$(get_sev "MAJOR")
          MINOR=$(get_sev "MINOR")
          INFO=$(get_sev "INFO")

          BLOCKER=${BLOCKER:-0}
          CRITICAL=${CRITICAL:-0}
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          INFO=${INFO:-0}

          TOTAL_ISSUES=$((BLOCKER + CRITICAL + MAJOR + MINOR + INFO))

          # RESP_V=$(curl -s -u "$SONAR_TOKEN:" \
          #  "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&types=VULNERABILITY&severities=CRITICAL,BLOCKER&resolved=false&ps=1")
          # VULN=$(echo "$RESP_V" | jq -r '.total // "N/A"')

          VULN=$((BLOCKER + CRITICAL))

          ok()  { echo "✅"; }
          bad() { echo "❌"; }
          na()  { echo "➖"; }

          if [ -n "$COV" ]; then
            COV_S=$(awk "BEGIN{exit !($COV >= $MIN_COVERAGE)}" && ok || bad)
          else COV_S=$(na); fi
          if [ -n "$DEBT" ]; then
            DEBT_S=$([ "$DEBT" -le "$MAX_DEBT_MIN" ] && ok || bad)
          else DEBT_S=$(na); fi
          if [ -n "$CX" ]; then
            CX_S=$([ "$CX" -lt "$MAX_COMPLEXITY" ] && ok || bad)
          else CX_S=$(na); fi
          if [ "$VULN" = "N/A" ]; then VULN_S=$(na)
          else VULN_S=$([ "$VULN" = "0" ] && ok || bad); fi

          if [ "$GATE" = "OK" ]; then GATE_S="✅ PASSED"; else GATE_S="❌ $GATE"; fi

          {
            echo "## Resultado SonarQube Cloud"
            echo ""
            echo "**Quality Gate:** $GATE_S"
            echo ""
            echo "### Condiciones del Quality Gate"
            echo "| Métrica | Valor | Umbral | Estado |"
            echo "|---|---|---|---|"
            echo "$RESP_G" | jq -r '.projectStatus.conditions[]? |
              "| \(.metricKey) | \(.actualValue // "N/A") | \(.errorThreshold // "-") | \(if .status=="OK" then "✅" else "❌" end) |"'
            echo ""
            echo "### Criterios del proyecto"
            echo "| Criterio | Valor | Meta | Estado |"
            echo "|---|---|---|---|"
            echo "| Cobertura | ${COV:-N/A}% | ≥ ${MIN_COVERAGE}% | $COV_S |"
            echo "| Deuda técnica | ${DEBT:-N/A} min | ≤ ${MAX_DEBT_MIN} min | $DEBT_S |"
            echo "| Complejidad ciclomática | ${CX:-N/A} | < ${MAX_COMPLEXITY} | $CX_S |"
            echo "| Vulnerabilidades críticas | $VULN | 0 | $VULN_S |"
            echo ""
            echo "### 📊 Reporte de Severidades (Issues Activos)"
            echo "| Severidad | Cantidad | Estado |"
            echo "|---|---|---|"
            echo "| 🔴 **Blocker** | $BLOCKER | $([ "$BLOCKER" -eq 0 ] && ok || bad) |"
            echo "| 🟠 **Critical** | $CRITICAL | $([ "$CRITICAL" -eq 0 ] && ok || bad) |"
            echo "| 🟡 **Major** | $MAJOR | ℹ️ |"
            echo "| 🔵 **Minor** | $MINOR | ℹ️ |"
            echo "| ⚪ **Info** | $INFO | ℹ️ |"
            echo "| **Total Issues** | **$TOTAL_ISSUES** | |"
            echo ""
            echo "[Ver en SonarCloud](https://sonarcloud.io/project/overview?id=$PROJECT_KEY)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE" != "OK" ] || echo "$COV_S$DEBT_S$CX_S$VULN_S" | grep -q "❌"; then
            echo "::warning title=Quality gates::Algunos criterios no se cumplen. Revisa la tabla en Summary."
          fi

          exit 0
