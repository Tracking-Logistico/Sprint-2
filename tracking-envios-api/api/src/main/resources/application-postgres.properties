spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${DB_PUERTO:5432}}/${DB_NAME:tracking_psep}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Eventos de integración (consumidos por el módulo de notificaciones)
app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
logging.level.org.springframework.amqp=DEBUG
logging.level.com.udea.demo.config.messaging=${LOG_LEVEL_MESSAGING:INFO}
logging.level.com.udea.demo.usuarios=${LOG_LEVEL_USUARIOS:INFO}

app.notifications.tracking-url=${TRACKING_URL:http://localhost:5173/tracking}
app.notifications.retry-ttl-ms=${NOTIF_RETRY_TTL_MS:5000}
app.notifications.max-intentos=${NOTIF_MAX_INTENTOS:3}
app.notifications.sms-provider=${SMS_PROVIDER:mock}
app.notifications.sms-enabled=${SMS_ENABLED:true}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
