spring.datasource.url=jdbc:h2:mem:trackingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.jpa.show-sql=false
spring.flyway.enabled=false
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
spring.mail.host=${MAIL_HOST:localhost}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
# Desarrollo local en memoria: puede arrancar sin clave, pero las operaciones con cédula fallarán.
app.identidad.cifrado.obligatorio=${IDENTIDAD_CIFRADO_OBLIGATORIO:false}
