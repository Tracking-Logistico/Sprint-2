spring.application.name=tracking-logistico
spring.profiles.active=${SPRING_PROFILE:postgres}
server.address=0.0.0.0
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

app.auth.failed-attempt-window-minutes=${AUTH_FAILED_ATTEMPT_WINDOW_MINUTES:10}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:15}
app.auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
app.auth.password-reset-minutes=${AUTH_PASSWORD_RESET_MINUTES:45}
app.auth.password-reset-url=${AUTH_PASSWORD_RESET_URL:http://localhost:5173/restablecer-password}
app.auth.client-inactivity-minutes=${AUTH_CLIENT_INACTIVITY_MINUTES:30}
app.auth.operational-inactivity-minutes=${AUTH_OPERATIONAL_INACTIVITY_MINUTES:15}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.verification-url=${APP_VERIFICATION_URL:${AUTH_VERIFICATION_URL:http://localhost:5173/verificar}}
app.dba.api-key=${DBA_API_KEY:}

# HU-13: clave maestra para cifrar la cédula y la fecha de nacimiento (AES-256-GCM) y para el índice ciego.
# Nunca va en el código ni en git. Por defecto es obligatoria: sin ella la API no arranca.
app.identidad.cifrado.clave-maestra=${IDENTIDAD_CLAVE_MAESTRA:}
app.identidad.cifrado.obligatorio=${IDENTIDAD_CIFRADO_OBLIGATORIO:true}

# Render Free blocks outbound SMTP ports. Use Resend over HTTPS in production.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.from=${MAIL_FROM:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.log-action-links=${MAIL_LOG_ACTION_LINKS:false}
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Operational limits; configurable without changing code.
app.shipment.max-weight-kg=${SHIPMENT_MAX_WEIGHT_KG:50}
app.shipment.max-dimension-cm=${SHIPMENT_MAX_DIMENSION_CM:120}
app.shipment.max-volume-cm3=${SHIPMENT_MAX_VOLUME_CM3:1000000}

# Límites por modalidad: EXPRESS es más restrictivo que ESTANDAR/PROGRAMADO.
app.shipment.express.max-weight-kg=${SHIPMENT_EXPRESS_MAX_WEIGHT_KG:20}
app.shipment.express.max-dimension-cm=${SHIPMENT_EXPRESS_MAX_DIMENSION_CM:80}
app.shipment.express.max-volume-cm3=${SHIPMENT_EXPRESS_MAX_VOLUME_CM3:500000}

# Fecha de jornada logistica, independiente de la zona del servidor Render.
app.operations.time-zone=${OPERATIONS_TIME_ZONE:America/Bogota}

app.api.role=usuarios
spring.application.name=tracking-identidad-api
server.port=${PORT:8081}
